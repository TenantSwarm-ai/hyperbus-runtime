# Reference layout — engine sidecar + two isolated agent workers.
# Build from monorepo root (hyperbus-core, hyperbus-langgraph, hyperbus-runtime siblings).
# HTTP RPC requires HYPERBUS_RPC_TOKEN on engine and workers (network-trust boundary).

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hyperbus
      POSTGRES_PASSWORD: hyperbus
      POSTGRES_DB: hyperbus
    networks: [hb-internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hyperbus"]
      interval: 5s
      timeout: 3s
      retries: 5

  hyperbus-engine:
    build:
      context: ../../..
      dockerfile: hyperbus-runtime/Dockerfile.engine
    environment:
      HB_TENANT_ID: acme
      DATABASE_URL: postgresql://hyperbus:hyperbus@postgres:5432/hyperbus
      HYPERBUS_RPC_TOKEN: dev-compose-token-change-me
    volumes:
      - ./acme-grants.yaml:/etc/hyperbus/grants.yaml:ro
    networks: [hb-internal, hb-agents]
    depends_on:
      postgres:
        condition: service_healthy

  support-bot:
    build:
      context: ../../..
      dockerfile: hyperbus-runtime/Dockerfile.worker
    environment:
      HB_TENANT_ID: acme
      HB_AGENT_ID: support-bot
      HB_DEFAULT_REGION: support
      HB_ISOLATION_PROFILE: isolate
      HYPERBUS_ENGINE_URL: http://hyperbus-engine:8080
      HYPERBUS_RPC_TOKEN: dev-compose-token-change-me
    networks: [hb-agents]
    depends_on: [hyperbus-engine]

  billing-bot:
    build:
      context: ../../..
      dockerfile: hyperbus-runtime/Dockerfile.worker
    environment:
      HB_TENANT_ID: acme
      HB_AGENT_ID: billing-bot
      HB_DEFAULT_REGION: billing
      HB_ISOLATION_PROFILE: isolate
      HYPERBUS_ENGINE_URL: http://hyperbus-engine:8080
      HYPERBUS_RPC_TOKEN: dev-compose-token-change-me
    networks: [hb-agents]
    depends_on: [hyperbus-engine]

networks:
  hb-internal:
    internal: true
  hb-agents:
