# Reference layout — engine sidecar + two isolated agent workers.
# Requires hyperbus-runtime implementation (RPC) before `docker compose up` succeeds.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hyperbus
      POSTGRES_PASSWORD: hyperbus
      POSTGRES_DB: hyperbus
    networks: [hb-internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hyperbus"]
      interval: 5s
      timeout: 3s
      retries: 5

  hyperbus-engine:
    build:
      context: ../..
      dockerfile: Dockerfile.engine
    environment:
      HB_TENANT_ID: acme
      DATABASE_URL: postgresql://hyperbus:hyperbus@postgres:5432/hyperbus
    volumes:
      - ./acme-grants.yaml:/etc/hyperbus/grants.yaml:ro
    command:
      - hyperbus-engine
      - --tenant
      - acme
      - --grants
      - /etc/hyperbus/grants.yaml
      - --listen
      - "0.0.0.0:8080"
    networks: [hb-internal, hb-agents]
    depends_on:
      postgres:
        condition: service_healthy

  support-bot:
    build:
      context: ../..
      dockerfile: Dockerfile.worker
    environment:
      HB_TENANT_ID: acme
      HB_AGENT_ID: support-bot
      HB_DEFAULT_REGION: support
      HB_ISOLATION_PROFILE: isolate
      HYPERBUS_ENGINE_URL: http://hyperbus-engine:8080
    networks: [hb-agents]
    depends_on: [hyperbus-engine]

  billing-bot:
    build:
      context: ../..
      dockerfile: Dockerfile.worker
    environment:
      HB_TENANT_ID: acme
      HB_AGENT_ID: billing-bot
      HB_DEFAULT_REGION: billing
      HB_ISOLATION_PROFILE: isolate
      HYPERBUS_ENGINE_URL: http://hyperbus-engine:8080
    networks: [hb-agents]
    depends_on: [hyperbus-engine]

networks:
  hb-internal:
    internal: true
  hb-agents:
